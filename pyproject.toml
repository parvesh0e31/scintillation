[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "url-phishing-detector"
version = "0.1.0"
description = "A URL-only phishing detection baseline"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "scikit-learn>=1.2", "joblib>=1.2",
  "fastapi>=0.100", "uvicorn[standard]>=0.22", "streamlit>=1.28"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
